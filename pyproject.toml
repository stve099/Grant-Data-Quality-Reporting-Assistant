[project]
name = "grant-assistant"
version = "1.3.0"
description = "Grant Data Quality & Reporting Assistant - audits program data, computes grant performance measures, and generates reports with a grounded AI data analyst."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Grant Assistant Contributors" }]
keywords = ["data-quality", "grant-reporting", "nonprofit", "analytics", "ai-agent"]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.37",
    "plotly>=5.22",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = [
    "playwright>=1.45",
]
mcp = [
    "mcp>=1.2",
]
openai = [
    "openai>=1.0",
]
# Static chart images for the Word report. Optional because kaleido ships a
# browser binary; without it the Word report is generated without charts.
charts = [
    "kaleido>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[project.scripts]
grant-assistant = "grant_assistant.cli.main:app"
grant-assistant-mcp = "grant_assistant.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grant_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line length handled by formatter
    "SIM108",  # ternary not always clearer
    "RUF001",  # typographic en dashes/minus signs are intentional in report text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true
files = ["src/grant_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/grant_assistant"]
omit = ["src/grant_assistant/ui/*"]
