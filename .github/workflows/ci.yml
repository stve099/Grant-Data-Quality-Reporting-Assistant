name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, format, and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # v7 is the highest floating major astral-sh publishes; later releases
        # exist only as exact tags (v9.0.0). v7 already runs on node24, which is
        # the point of the bump, so track the major rather than pin a patch.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: requirements.txt matches uv.lock
        # The deployed Streamlit demo installs from requirements.txt, not uv.lock.
        # If they drift, the demo silently runs different dependency versions than
        # everything CI just tested.
        run: |
          uv export --no-dev --extra openai --no-hashes --no-emit-project --no-annotate \
            --no-header --format requirements-txt > /tmp/expected.txt
          if ! diff <(grep -vE '^\s*(#|\.$|$)' requirements.txt) \
                    <(grep -vE '^\s*(#|$)' /tmp/expected.txt); then
            echo "::error::requirements.txt is out of date. Regenerate it (see its header)."
            exit 1
          fi

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # v7 is the highest floating major astral-sh publishes; later releases
        # exist only as exact tags (v9.0.0). v7 already runs on node24, which is
        # the point of the bump, so track the major rather than pin a patch.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra openai

      - name: Run tests
        # Coverage is measured by the all-extras job below, not here. This job
        # skips the PDF, PowerPoint, and static-chart tests by design, so its
        # numbers understate those renderers badly enough to be misleading
        # (pptx_report.py reads as 15% here and 98% with the extras installed).
        run: uv run pytest

  tests-all-extras:
    name: Tests (all optional extras)
    runs-on: ubuntu-latest
    # The job above deliberately omits pdf/pptx/charts: it is the guard that
    # optional extras degrade rather than crash. That means it *skips* every test
    # of the PDF, PowerPoint, and static-chart renderers — pptx_report.py sat at
    # 15% coverage in CI while shipping a documented feature and a committed
    # example deck. This job installs everything so those paths actually run.
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # v7 is the highest floating major astral-sh publishes; later releases
        # exist only as exact tags (v9.0.0). v7 already runs on node24, which is
        # the point of the bump, so track the major rather than pin a patch.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install the headless browser the PDF backend drives
        # pdf_backend() probes only for the playwright import, so installing the
        # extra makes the PDF tests run. Without the browser binary they would
        # then fail rather than skip.
        run: uv run playwright install --with-deps chromium

      - name: Confirm every optional backend is actually present
        # A silent skip here would defeat the entire point of this job.
        run: |
          uv run python -c "
          import importlib.util as u
          from grant_assistant.reporting.pdf_report import pdf_backend
          from grant_assistant.reporting.chart_images import chart_backend_available
          assert pdf_backend() is not None, 'no PDF backend'
          assert chart_backend_available(), 'no static-chart backend'
          for name in ('pptx', 'mcp', 'openai'):
              assert u.find_spec(name) is not None, name
          print('all optional backends present')
          "

      - name: Run tests with coverage
        # This is the only job that exercises every renderer, so it is the only
        # one whose coverage figures describe the real project.
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # v7 is the highest floating major astral-sh publishes; later releases
        # exist only as exact tags (v9.0.0). v7 already runs on node24, which is
        # the point of the bump, so track the major rather than pin a patch.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: CLI help
        run: uv run grant-assistant --help

      - name: Validate profiles
        run: uv run grant-assistant validate-config

      - name: Generate sample data and run full pipeline
        run: |
          uv run grant-assistant generate-sample-data --output ci_sample
          uv run grant-assistant analyze ci_sample/housing_program_flawed.csv --profile housing_stability --output ci_out
          uv run grant-assistant report ci_sample/housing_program_flawed.csv --profile housing_stability --output ci_out
          test -f ci_out/grant_report.html
          test -f ci_out/grant_report.docx
          test -f ci_out/audit_workbook.xlsx

  windows-smoke:
    name: Windows CLI smoke test (cp1252 console guard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # v7 is the highest floating major astral-sh publishes; later releases
        # exist only as exact tags (v9.0.0). v7 already runs on node24, which is
        # the point of the bump, so track the major rather than pin a patch.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: uv sync

      - name: CLI help
        run: uv run grant-assistant --help

      - name: Validate profiles
        run: uv run grant-assistant validate-config

      - name: Run the compare command on a real Windows console
        # Force the codec that triggered the original crash. GitHub's redirected
        # stdout is otherwise commonly UTF-8 even on a Windows runner.
        env:
          PYTHONIOENCODING: cp1252
        run: |
          uv run python -c "import sys; assert sys.stdout.encoding.lower().replace('-', '') == 'cp1252', sys.stdout.encoding"
          uv run grant-assistant generate-sample-data --output ci_sample
          uv run grant-assistant compare ci_sample/housing_program_clean.csv ci_sample/housing_program_flawed.csv --profile housing_stability --records --records-output ci_out/record_diff.csv

      - name: Check outputs exist
        shell: pwsh
        run: |
          if (-not (Test-Path ci_out/record_diff.csv)) { throw "record_diff.csv missing" }
          if (-not (Test-Path ci_sample/housing_program_flawed.csv)) { throw "flawed sample missing" }
