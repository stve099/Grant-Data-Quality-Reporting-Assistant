name: Claude Code Review

# Reviews pull requests against this project's contracts (see CLAUDE.md):
# deterministic calculation, aggregate-only AI context, and test coverage for
# every new rule or metric.
#
# Requires an ANTHROPIC_API_KEY repository secret. Without it the review step
# is skipped and the job still passes, so forks and clones are not blocked by a
# review that could never have run.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    # A pull request from a fork cannot read the secret at all.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # The secrets context reaches a job's env but not its `if`, so presence is
      # tested here and read by the step below. Without this the action installs
      # itself and only then fails validation, which fails the whole check --
      # the opposite of the degradation this workflow documents.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review with Claude
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request against the contracts in CLAUDE.md.

            Priorities, in order:
            1. Grounding — does any change let the AI layer produce a number that
               the deterministic layer did not calculate?
            2. Privacy — could client-level data (IDs, raw rows) reach a prompt,
               a report narrative, or a chat answer?
            3. Correctness — do new audit rules read `raw` vs `df` correctly, take
               thresholds from the profile, and avoid double-reporting?
            4. Coverage — does every new rule have a targeted test, and every new
               metric an expected-value test?
            5. Docs — does the README still describe only features that exist?

            Comment only on real problems. For each, give the file and line, a
            concrete failure case, and the fix. If the PR is clean, say so briefly
            and name what you checked.
