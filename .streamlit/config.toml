# Streamlit theme aligned with the project design system (docs/design_system.md).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 200
